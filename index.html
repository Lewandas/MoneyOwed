
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Dad Owes Elijah for Yard Work</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1464d2, #20b878);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #174b83;
            margin-top: 0;
            font-size: 26px;
        }

        p {
            text-align: center;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background: #1769aa;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f0f8ff;
        }

        td:last-child,
        th:last-child {
            text-align: right;
        }

        .total {
            background: #d9f7e8;
            font-weight: bold;
            color: #146c43;
            font-size: 18px;
        }

        .total td {
            border-top: 2px solid #20b878;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Money Dad Owes Elijah</h1>
        <p>Yard Work & Other Jobs</p>

        <table>
            <thead>
                <tr>
                    <th>Work</th>
                    <th>Money</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Trash</td>
                    <td>$3.00</td>
                </tr>
                <tr>
                    <td>Raking</td>
                    <td></td>
                </tr>
                <tr>
                    <td>Website Creation</td>
                    <td>$5.00</td>
                </tr>
                <tr>
                    <td>Leaves</td>
                    <td></td>
                </tr>
                <tr>
                    <td>Sticks</td>
                    <td></td>
                </tr>
                <tr>
                    <td>Putting Sticks & Leaves in Fire Pit</td>
                    <td></td>
                </tr>

                <tr class="total">
                    <td>Total Owed</td>
                    <td>$8.00</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
